[build]
  command = "npm run install:all && npm run build"
  publish = "client/dist"
  functions = "server/netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "CORS_ORIGINS,PUBLIC_URL,SUPABASE_BUCKET,NODE_ENV,PORT,ADMIN_NAME"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200